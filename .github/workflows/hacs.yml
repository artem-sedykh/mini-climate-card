name: Hacs Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # HACS validation rules change on their side, not ours: a repository that
    # passes today can start failing without a single commit here.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS
    # On a pull request the action validates the repository the pull request
    # comes from. A fork has no releases and dist/ is not committed, so HACS
    # finds no bundle and fails whatever the diff. A job skipped by `if`
    # reports success, so the required check does not block the merge; master
    # is still validated on push and every week.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

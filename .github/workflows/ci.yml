name: Continuous Integration

on:
  push:
    branches: ['*']
  pull_request:
    # `**`, not `*`: a single star stops at a slash, so a pull request whose
    # base is a branch like `refactor/models` matches nothing and runs no
    # checks at all - without saying so anywhere. The push trigger keeps `*`
    # deliberately, otherwise every pull request runs everything twice.
    branches: ['**']
  # Nothing in this repository changes on its own - but everything it is built
  # against does: transitive dependencies, the runner image, the browsers the
  # tests will run in. A weekly run on master finds a break nobody caused
  # before an outside contributor runs into it on their own pull request and
  # assumes it is theirs.
  #
  # Monday morning UTC, and deliberately not on the hour: GitHub queues
  # scheduled runs across every repository at once, and a job asking for a
  # popular minute waits longer for it.
  #
  # Worth knowing: GitHub disables scheduled workflows in a repository with no
  # activity for 60 days, and emails the owner when it does. A quiet stretch
  # therefore turns this off rather than failing loudly.
  schedule:
    - cron: '23 6 * * 1'
  # So the same run can be triggered by hand when something outside is
  # suspected - a Home Assistant frontend change, a dependency release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          # From .nvmrc, so this file and a contributor's shell cannot drift
          # apart.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly what the
        # lockfile says and fails when the lockfile and package.json disagree,
        # instead of quietly resolving something else and rewriting the file.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run rollup

      - name: Bundle assertions
        # Everything that has gone wrong in the sister card went wrong in the
        # build rather than in the source, and all of it was visible in the
        # output file. See scripts/check-bundle.mjs.
        run: npm run check:bundle

      - name: Upload bundle
        # So a change to the card can be tried without building it yourself.
        # This is also what the bundle assertions of #198 will run against.
        uses: actions/upload-artifact@v7
        with:
          name: mini-climate-card-bundle
          path: dist/mini-climate-card-bundle.js
          if-no-files-found: error

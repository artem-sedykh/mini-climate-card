name: Continuous Integration

on:
  push:
    # `!badges` is belt and braces. That branch holds one JSON file written by
    # the badge job below, and a run of this workflow against it would fail at
    # `npm ci`. A push made with GITHUB_TOKEN does not trigger workflows in the
    # first place - GitHub blocks that to stop them recursing - so today the
    # exclusion changes nothing; it is here so the badge cannot start posting
    # red runs if that ever changes.
    branches: ['*', '!badges']
  pull_request:
    # `**`, not `*`: a single star stops at a slash, so a pull request whose
    # base is a branch like `refactor/models` matches nothing and runs no
    # checks at all - without saying so anywhere. The push trigger keeps `*`
    # deliberately, otherwise every pull request runs everything twice.
    branches: ['**']
  # Nothing in this repository changes on its own - but everything it is built
  # against does: transitive dependencies, the runner image, the browsers the
  # tests will run in. A weekly run on master finds a break nobody caused
  # before an outside contributor runs into it on their own pull request and
  # assumes it is theirs.
  #
  # Monday morning UTC, and deliberately not on the hour: GitHub queues
  # scheduled runs across every repository at once, and a job asking for a
  # popular minute waits longer for it.
  #
  # Worth knowing: GitHub disables scheduled workflows in a repository with no
  # activity for 60 days, and emails the owner when it does. A quiet stretch
  # therefore turns this off rather than failing loudly.
  schedule:
    - cron: '23 6 * * 1'
  # So the same run can be triggered by hand when something outside is
  # suspected - a Home Assistant frontend change, a dependency release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This name is the required status check on master, so it is not free to
    # change: renaming the job renames the check, and the name the protection
    # rule still expects then sits "expected, waiting for status to be
    # reported" forever, blocking every pull request. To rename it, update the
    # required check first - the pull request that carries the rename is then
    # the first to report under the new name, and merges on its own.
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          # From .nvmrc, so this file and a contributor's shell cannot drift
          # apart.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly what the
        # lockfile says and fails when the lockfile and package.json disagree,
        # instead of quietly resolving something else and rewriting the file.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # esbuild strips the types and checks none of them, so this is the only
        # thing that reads them. It is a step of its own rather than part of
        # another one: a type error and a lint error are different failures and
        # should not have to be told apart by reading a log.
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Documentation paths
        # Cheap, and it needs neither a build nor a browser, so it fails early:
        # every path the documentation names has to exist. Six of them did not
        # for the whole of the TypeScript migration (#244).
        run: npm run check:docs

      - name: Changelog
        # CHANGELOG.md is generated from release_notes/; this fails if the two
        # drift. It needs neither a build nor a browser, so it starts as early
        # as the documentation check.
        run: npm run changelog -- --check

      - name: Unit tests
        # With coverage: the thresholds in vitest.config.mjs fail the run if it
        # slides. `npm test` stays the plain run, because that is the one
        # people wait for locally.
        run: npm run test:coverage

      - name: Coverage summary
        # In the job summary rather than only in the log, which is where a
        # number nobody scrolls to goes to be ignored.
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          {
            echo '### Coverage'
            echo ''
            echo 'The unit layer only - see `coverage.exclude` in vitest.config.mjs.'
            echo ''
            echo '| | % | covered |'
            echo '|---|---|---|'
            node -e '
              const total = require("./coverage/coverage-summary.json").total;
              for (const key of ["statements", "branches", "functions", "lines"]) {
                const m = total[key];
                console.log(`| ${key} | ${m.pct}% | ${m.covered}/${m.total} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Browsers
        # The component tests need these, and the runner image's own Chrome is
        # whatever that week's image happens to carry. Playwright pins both to
        # the versions in the lockfile, so a failure here is the card's.
        #
        # WebKit as well as Chromium: the Home Assistant companion app on iOS
        # renders in WKWebView, and until #223 nothing had ever run this card
        # in a second engine.
        run: npx playwright install --with-deps chromium webkit

      - name: Component tests
        run: npm run test:browser

      - name: Build
        run: npm run rollup

      - name: Bundle assertions
        # Everything that has gone wrong in the sister card went wrong in the
        # build rather than in the source, and all of it was visible in the
        # output file. See scripts/check-bundle.mjs.
        run: npm run check:bundle

      - name: Upload bundle
        # So a change to the card can be tried without building it yourself.
        uses: actions/upload-artifact@v7
        with:
          name: mini-climate-card-bundle
          path: dist/mini-climate-card-bundle.js
          if-no-files-found: error

      - name: Upload the coverage summary
        # Only what the badge job needs, and only on the runs that feed it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

  # The README badge (#240). Kept out of the job above so that job keeps its
  # read-only token: this one needs `contents: write` to push, and a pull
  # request run has no business holding that.
  #
  # The number lives in this repository, on a branch of its own, rather than in
  # a third-party service - which would mean an account and a standing
  # credential in the secrets. shields.io renders it and holds nothing.
  badge:
    name: Coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download the coverage summary
        uses: actions/download-artifact@v7
        with:
          name: coverage-summary
          path: coverage

      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/coverage-badge.mjs "$RUNNER_TEMP/coverage.json"

          # An orphan branch built from scratch and force-pushed: one file, one
          # commit, no history to grow. Nothing reads the branch but shields.
          mkdir "$RUNNER_TEMP/badges"
          mv "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/badges/"
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "ci: coverage badge for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges
